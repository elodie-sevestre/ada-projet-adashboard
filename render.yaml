services:
  - type: web
    name: adashboard-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 3000

  - type: web
    name: adashboard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install -g pnpm && pnpm install && pnpm build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
